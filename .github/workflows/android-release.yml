# Signed Play upload. workflow_dispatch and v* tags build the real AAB and APK.
# Pull requests run only signed-build-smoke, which creates a throwaway key in
# RUNNER_TEMP, signs a release, checks the signature, and deletes the key.
# That smoke build is not a Play artifact.
name: Android release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName shown on the build. Empty uses package.json (1.3.1).'
        required: false
        type: string
      versionCode:
        description: 'Positive integer versionCode. Empty uses package.json androidVersionCode. Raise it before every Play upload.'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  signed-build-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Validate levels, paths, secrets, and unit tests
        run: npm run validate

      - name: Copy the shipped web game
        run: node scripts/copy-web.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Sign a release with a throwaway key
        working-directory: android
        run: |
          set +x
          set -eu
          umask 077
          # Java 17 keytool writes PKCS12, which keeps one password. The smoke
          # key uses that same password for the store and the key.
          STORE_PASS="$(openssl rand -base64 24 | tr -d '\n/+=')"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/prismburst-smoke.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias prismburst-smoke \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=PrismBurst Smoke, OU=CI, O=PrismBurst, L=Test, ST=Test, C=US"
          export PRISMBURST_KEYSTORE="$RUNNER_TEMP/prismburst-smoke.jks"
          export PRISMBURST_KEYSTORE_PASSWORD="$STORE_PASS"
          export PRISMBURST_KEY_ALIAS="prismburst-smoke"
          export PRISMBURST_KEY_PASSWORD="$STORE_PASS"
          NAME="$(node -p "require('../package.json').version")"
          CODE="$(node -p "String(require('../package.json').androidVersionCode)")"
          ./gradlew bundleRelease assembleRelease --no-daemon -PversionCode="$CODE" -PversionName="$NAME"

      - name: Print checksums and verify the signature
        working-directory: android
        run: |
          set -eu
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$AAB"
          test -s "$APK"
          echo "SHA-256 checksums (file contents, not the signing key)"
          sha256sum "$AAB" "$APK"
          echo "apksigner verify --print-certs"
          apksigner verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          grep -q "certificate SHA-256 digest" "$RUNNER_TEMP/apk-certs.txt"
          echo "jarsigner -verify AAB"
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/aab-jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-jarsigner.txt"
          echo "jarsigner -verify APK"
          jarsigner -verify "$APK" | tee "$RUNNER_TEMP/apk-jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/apk-jarsigner.txt"
          echo "Package identity"
          aapt dump badging "$APK" | grep -E 'package:|sdkVersion:|targetSdkVersion:'
          {
            echo "## Throwaway signed build"
            echo "This pull-request job signed a release with a key that exists only in RUNNER_TEMP."
            echo "It does not upload prismburst-release-aab. Do not ship this output to Play."
            echo "The real upload waits until the four signing secrets exist and someone runs this workflow by hand."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the throwaway keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/prismburst-smoke.jks"

  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require the four signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          set -eu
          missing=""
          if [ -z "${KEYSTORE_BASE64//[[:space:]]/}" ]; then missing="$missing KEYSTORE_BASE64"; fi
          if [ -z "${KEYSTORE_PASSWORD//[[:space:]]/}" ]; then missing="$missing KEYSTORE_PASSWORD"; fi
          if [ -z "${KEY_ALIAS//[[:space:]]/}" ]; then missing="$missing KEY_ALIAS"; fi
          if [ -z "${KEY_PASSWORD//[[:space:]]/}" ]; then missing="$missing KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "Missing GitHub Actions secret(s):$missing"
            echo "Add each one under Settings, Secrets and variables, Actions, New repository secret."
            echo "This log does not print secret values."
            exit 1
          fi
          echo "All four signing secrets are set."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Validate levels, paths, secrets, and unit tests
        run: npm run validate

      - name: Copy the shipped web game
        run: node scripts/copy-web.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Resolve versionName and versionCode
        id: ver
        run: |
          set -eu
          NAME="$(node -p "require('./package.json').version")"
          CODE="$(node -p "String(require('./package.json').androidVersionCode)")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            INPUT_NAME="${{ inputs.versionName }}"
            INPUT_CODE="${{ inputs.versionCode }}"
            if [ -n "$INPUT_NAME" ]; then NAME="$INPUT_NAME"; fi
            if [ -n "$INPUT_CODE" ]; then CODE="$INPUT_CODE"; fi
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          fi
          case "$NAME" in
            *[!A-Za-z0-9._+-]*) echo "versionName may contain only letters, numbers, dots, underscores, plus, and hyphens"; exit 1 ;;
          esac
          case "$CODE" in
            ''|*[!0-9]*) echo "versionCode must be a positive integer"; exit 1 ;;
          esac
          if [ "$CODE" -lt 1 ]; then echo "versionCode must be a positive integer"; exit 1; fi
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/prismburst-upload.jks
        run: |
          set +x
          set -eu
          umask 077
          python3 -c 'import base64, os, pathlib, sys
raw = os.environ.get("KEYSTORE_BASE64", "")
if not raw.strip():
    sys.stderr.write("KEYSTORE_BASE64 is empty\n")
    sys.exit(1)
try:
    data = base64.b64decode(raw)
except Exception:
    sys.stderr.write("KEYSTORE_BASE64 is not valid base64\n")
    sys.exit(1)
if len(data) < 16:
    sys.stderr.write("Decoded keystore is too small\n")
    sys.exit(1)
path = pathlib.Path(os.environ["KEYSTORE_PATH"])
path.write_bytes(data)
os.chmod(path, 0o600)
print("Decoded upload keystore into RUNNER_TEMP")'

      - name: Build the signed release
        working-directory: android
        env:
          PRISMBURST_KEYSTORE: ${{ runner.temp }}/prismburst-upload.jks
          PRISMBURST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PRISMBURST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PRISMBURST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
        run: |
          set +x
          set -eu
          ./gradlew bundleRelease assembleRelease --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Print checksums and verify the signature
        working-directory: android
        run: |
          set -eu
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$AAB"
          test -s "$APK"
          echo "SHA-256 checksums (file contents, not the signing key)"
          sha256sum "$AAB" "$APK"
          echo "apksigner verify --print-certs"
          apksigner verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          grep -q "certificate SHA-256 digest" "$RUNNER_TEMP/apk-certs.txt"
          echo "jarsigner -verify AAB"
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/aab-jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-jarsigner.txt"
          echo "jarsigner -verify APK"
          jarsigner -verify "$APK" | tee "$RUNNER_TEMP/apk-jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/apk-jarsigner.txt"
          echo "Package identity"
          aapt dump badging "$APK" | grep -E 'package:|sdkVersion:|targetSdkVersion:'

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: prismburst-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: prismburst-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Delete the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/prismburst-upload.jks"
