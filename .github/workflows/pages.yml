# Deploys the static game to GitHub Pages.
# Enable once: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate levels, file references, and secrets
        run: |
          node scripts/validate-levels.js
          node scripts/check-paths.js
          node scripts/check-secrets.js
          node tests/cloud-unit.js

      - name: Assemble _site (game files only; no tests/, scripts/, .github/)
        run: |
          mkdir -p _site
          cp -r index.html style.css game.js levels.js sw.js manifest.webmanifest config.js privacy.html privacy-policy.html delete-account.html .nojekyll js lib icons _site/
          ls -laR _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
