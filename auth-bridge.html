<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>PRISMBURST — Google sign-in</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; background: #0b0618; color: #e8e0ff; text-align: center; padding: 24px; }
    .card { max-width: 28rem; }
    button { margin-top: 1rem; padding: .75rem 1.25rem; border: 0; border-radius: 999px; background: #7c5cff; color: #fff; font-weight: 700; }
    .fine { opacity: .75; font-size: .9rem; }
    #err { color: #ffb4b4; min-height: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Continue with Google</h1>
    <p class="fine">Android Google sign-in bridge for PRISMBURST (bridge v3). Uses a full-page Google sign-in (works in Chrome Custom Tabs). Email login never uses this page.</p>
    <p id="err" role="status" aria-live="polite"></p>
    <button type="button" id="go">Continue with Google</button>
  </div>
  <script src="js/firebase-config.js?bv=3"></script>
  <script>
  (function () {
    'use strict';
    var BRIDGE_VERSION = '3';
    var REDIRECT_URI = 'https://hamzaxali.github.io/prismburst-brick-odyssey/auth-bridge.html';
    var params = new URLSearchParams(location.search);
    var hashParams = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
    var state = params.get('state') || hashParams.get('state') || '';
    var nonce = params.get('nonce') || '';
    var errEl = document.getElementById('err');
    function say(t) { errEl.textContent = t || ''; }
    function deepLink(hash) {
      return 'com.prismburst.brickodyssey://auth#' + hash;
    }
    function goBack(parts) {
      parts = parts || {};
      parts.bv = BRIDGE_VERSION;
      var q = new URLSearchParams();
      ['access_token', 'id_token', 'state', 'nonce', 'bv', 'error', 'error_code', 'diag'].forEach(function (k) {
        if (parts[k] != null && parts[k] !== '') q.set(k, parts[k]);
      });
      Object.keys(parts).forEach(function (k) {
        if (q.has(k)) return;
        if (parts[k] != null && parts[k] !== '') q.set(k, parts[k]);
      });
      // Never put tokens in the visible page text or console.
      location.replace(deepLink(q.toString()));
    }
    function clientId() {
      var cfg = window.PB_FIREBASE || {};
      return String(cfg.googleWebClientId || '').trim();
    }
    function buildGoogleAuthUrl() {
      var cid = clientId();
      if (!cid) return '';
      var q = new URLSearchParams();
      q.set('client_id', cid);
      q.set('redirect_uri', REDIRECT_URI);
      // id_token only — this Web client is registered for OpenID id_token (Firebase Google provider).
      q.set('response_type', 'id_token');
      q.set('scope', 'openid email profile');
      q.set('state', state);
      q.set('nonce', nonce || ('n' + String(Date.now())));
      q.set('prompt', 'select_account');
      return 'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString();
    }
    function handleOAuthReturn() {
      var idToken = hashParams.get('id_token') || params.get('id_token') || '';
      var accessToken = hashParams.get('access_token') || params.get('access_token') || '';
      var err = hashParams.get('error') || params.get('error') || '';
      var errDesc = hashParams.get('error_description') || params.get('error_description') || '';
      var retState = hashParams.get('state') || params.get('state') || state;
      if (!idToken && !accessToken && !err) return false;
      // Clear hash so a refresh does not re-post tokens.
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
      if (err) {
        goBack({
          error: errDesc || err || 'Google sign-in was cancelled.',
          error_code: /^auth\//.test(err) ? err : ('auth/bridge-' + String(err).replace(/[^a-z0-9_-]/gi, '').slice(0, 40) || 'error'),
          diag: '[bridge v' + BRIDGE_VERSION + ', oauth-error]',
          state: retState
        });
        return true;
      }
      if (!idToken && !accessToken) {
        goBack({
          error: 'Google returned no tokens.',
          error_code: 'auth/bridge-empty-tokens',
          diag: '[bridge v' + BRIDGE_VERSION + ', empty-tokens]',
          state: retState
        });
        return true;
      }
      goBack({
        access_token: accessToken || '',
        id_token: idToken || '',
        state: retState,
        nonce: nonce,
        diag: '[bridge v' + BRIDGE_VERSION + ', oauth-ok]'
      });
      return true;
    }

    if (handleOAuthReturn()) return;

    if (!state) {
      say('Sign-in could not start. Close this tab and try again from the game.');
      document.getElementById('go').disabled = true;
      goBack({
        error: 'Missing state.',
        error_code: 'auth/bridge-missing-state',
        diag: '[bridge v' + BRIDGE_VERSION + ', missing-state]'
      });
      return;
    }
    if (!clientId()) {
      say('Google sign-in is not configured on this page.');
      document.getElementById('go').disabled = true;
      goBack({
        error: 'Missing Google web client id.',
        error_code: 'auth/bridge-missing-client',
        diag: '[bridge v' + BRIDGE_VERSION + ', missing-client]',
        state: state
      });
      return;
    }

    document.getElementById('go').addEventListener('click', function () {
      var url = buildGoogleAuthUrl();
      if (!url) {
        goBack({
          error: 'Could not start Google sign-in.',
          error_code: 'auth/bridge-build-url',
          diag: '[bridge v' + BRIDGE_VERSION + ', build-url]',
          state: state
        });
        return;
      }
      say('Opening Google…');
      // Top-level navigation works inside Chrome Custom Tabs (popup does not).
      location.assign(url);
    });
  })();
  </script>
</body>
</html>
