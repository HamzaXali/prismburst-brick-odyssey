<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PRISMBURST — Brick Odyssey</title>
  <meta name="description" content="A neon-crystal brick-breaker for your phone. 5 worlds, 100 levels, power-ups and cosmetic skins. Plays offline.">
  <meta name="theme-color" content="#070a1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div>PRISMBURST</div>
    <noscript><p>This game needs JavaScript enabled.</p></noscript>
  </div>
  <script src="lib/phaser.min.js"></script>
  <script src="levels.js"></script>
  <script src="js/core.js"></script>
  <script src="js/menus.js"></script>
  <script src="game.js"></script>
  <script>
    // Offline support on the web (GitHub Pages). Skipped inside native wrappers,
    // where the files are already bundled on the device.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed', e); });
      });
    }
  </script>
</body>
</html>
